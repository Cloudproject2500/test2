<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskMate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/mini-logo.svg" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="logo-container">
            <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 0.75rem;">
                <img src="/logo1.png" alt="TaskMate Logo" class="logo-icon">
                <span class="logo-text">TaskMate</span>
            </a>
        </div>
        <nav class="nav">
            <a href="/" class="nav-link">Back to Home</a>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Please enter your details to sign in.</p>

            <div class="social-buttons">
                <button id="btn-google" class="btn-social btn-google">
                    <img src="/googlelogo.png" alt="Google" class="social-icon">
                    Continue with Google
                </button>
            </div>

            <div class="divider">
                <span>Or sign in with email</span>
            </div>

            <form class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Sign in</button>
            </form>

            <div class="login-footer">
                Don't have an account? <a href="/signup/" class="link-blue">Sign up</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 TaskMate. All rights reserved.
    </footer>

    <script type="module">
        import { supabase } from '../src/lib/supabase.ts'

        const handleGoogleSignIn = async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: `${window.location.origin}/auth/callback/`,
                    queryParams: {
                        access_type: 'offline',
                        prompt: 'consent',
                    },
                }
            })
            if (error) {
                console.error('Error signing in:', error.message);
                alert('Error signing in: ' + error.message);
            }
        }

        const handleEmailLogin = async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                console.error('Login error:', error.message);
                alert('Error logging in: ' + error.message);
            } else {
                console.log('Login successful:', data);
                // Check if user has selected a role
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('user_id', data.user.id)
                    .single();

                if (profile && profile.role === 'user') {
                    window.location.href = '/welcome/';
                } else {
                    window.location.href = '/demo/index.html';
                }
            }
        }

        const googleBtn = document.getElementById('btn-google');
        if (googleBtn) {
            googleBtn.addEventListener('click', handleGoogleSignIn);
        }

        const loginForm = document.querySelector('.login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', handleEmailLogin);
        }
    </script>
</body>

</html>
